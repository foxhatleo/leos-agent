name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.14"]
        exclude:
          # setup-python ships no 3.9 build for the arm64 macOS runners.
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavioral tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate manifests, payload, and install invariants
        run: python3 scripts/check.py
      - name: Enforce static prompt budgets
        run: python3 scripts/measure_context.py --check

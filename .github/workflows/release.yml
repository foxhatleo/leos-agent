name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check generated adapters
        run: python3 plugins/leo/scripts/render_adapters.py --check
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Claude plugin
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.220
          claude plugin validate .
      - name: Validate Codex plugin
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/vendor/codex/validate_plugin.py plugins/leo
      - name: Validate Cursor plugin
        run: node tools/vendor/cursor/validate-template.mjs
      - name: Verify tag and manifest versions
        run: python3 tools/release.py --check-version "$GITHUB_REF_NAME"
      - name: Require license inventory
        run: |
          find . -iname 'LICENSE*' -type f -print | sort | tee license-inventory.txt
          test -s license-inventory.txt

  publish:
    needs: validate
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Build release archives and license inventory
        run: |
          python3 tools/release.py --build dist
          find dist -type f -name '*.tar.gz' -exec sh -c 'tar -tzf "$1" | grep "/LICENSE$"' _ {} \;
          find . -iname 'LICENSE*' -type f -print | sort | tee dist/license-inventory.txt
      - name: Stage and inventory clean npm package
        run: python3 tools/release.py --stage-npm npm-stage --inventory dist/npm-package-inventory.txt
      - name: Publish to npm when the exact version is absent
        run: |
          npm install --global npm@11.17.0
          npm_version=${GITHUB_REF_NAME#v}
          python3 tools/release.py --publish-npm ./npm-stage "$npm_version"
      - name: View or create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py --sync-github-release "$GITHUB_REF_NAME" dist
